[flake8]
# max-line-length matches [FORMAT] in .pylintrc; black formats to 85 but is
# allowed to exceed it on strings and long identifiers.
max-line-length = 100
extend-ignore = E203, W503, E402, W292
exclude =
    .git,
    __pycache__,
    build,
    dist,
    sse_lib
# Names imported for re-export (consumers import them from this module, not
# from the original). See the import lines they sit on.
per-file-ignores =
    src/sse_api/config/settings.py: F401
    src/sse_api/core/errors.py: F401
    src/sse_api/data/api.py: F401
    src/sse_api/engine/controllers/models_logic/generative.py: F401
    src/sse_api/engine/controllers/search/semantic.py: F401
    src/sse_api/engine/core/search_engine.py: F401
    src/sse_api/engine/database/data_adapter.py: F401
    src/sse_api/engine/models.py: F401
    src/sse_tools/evaluation/evaluator/evaluate_rag_llm.py: F401
