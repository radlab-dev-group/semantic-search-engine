# =============================================================================
# Semantic Search Engine — nginx reverse proxy (production).
#
# Mounted read-only into the `nginx` service as
# /etc/nginx/conf.d/default.conf (see docker-compose.yml).
#
# TLS material is expected in ./nginx/certs (mounted at /etc/nginx/tls):
#   fullchain.pem  — server certificate + intermediate chain
#   privkey.pem    — private key, chmod 600, never committed
#
# Every request reaching gunicorn carries X-Forwarded-Proto: https, which is
# what Django's SECURE_PROXY_SSL_HEADER checks while DEBUG=0.
# =============================================================================

upstream sse_api {
    server api:8000;
    keepalive 16;
}

# --- plain HTTP: redirect everything to HTTPS --------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Load-balancer / external monitoring probes must not be redirected.
    location = /api/healthz {
        access_log off;
        proxy_pass http://sse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    return 301 https://$host$request_uri;
}

# --- HTTPS: the only public entry point --------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Has to be >= DATA_UPLOAD_MAX_MEMORY_SIZE / FILE_UPLOAD_MAX_MEMORY_SIZE.
    client_max_body_size 2560m;

    access_log /var/log/nginx/sse.access.log;
    error_log  /var/log/nginx/sse.error.log warn;

    # Collected static files (collectstatic -> named volume).
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Readiness/liveness probe: no access log, no buffering.
    location = /api/healthz {
        access_log off;
        proxy_pass http://sse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://sse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER matches on this exact value.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Embedding/indexing requests are long running; keep in sync with
        # GUNICORN_TIMEOUT.
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
