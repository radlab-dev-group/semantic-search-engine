# =============================================================================
# Semantic Search Engine — production compose stack (API + PostgreSQL + Milvus
# + nginx, plus an optional Celery worker + RabbitMQ under --profile indexing).  Read SETUP.md ("Production deployment") before the first start.
#
#   cp .env.example .env      # or: ./run-en.sh config
#   $EDITOR .env              # every CHANGE_ME has to disappear
#   docker compose --profile tools run --rm tools python -m sse_api.manage migrate --noinput
#   docker compose up -d
#
# All secrets come from `.env`; nothing sensitive is committed or baked in.
# =============================================================================

name: sse

services:
  # --- application -----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RADLAB_DATA: ${INSTALL_RADLAB_DATA:-0}
        INSTALL_LLM_ROUTER: ${INSTALL_LLM_ROUTER:-0}
        RADLAB_DATA_REF: ${RADLAB_DATA_REF:-master}
        LLM_ROUTER_REF: ${LLM_ROUTER_REF:-master}
    image: sse-api:${SSE_IMAGE_TAG:-0.0.2}
    restart: unless-stopped
    env_file: .env
    environment:
      # Service names on the compose network win over the host names in .env.
      ENV_DB_HOST: postgres
      ENV_DB_PORT: "5432"
      ENV_MILVUS_HOST: milvus
      ENV_MILVUS_PORT: "19530"
      ENV_DEBUG: "0"
      DJANGO_SETTINGS_MODULE: sse_api.config.settings
      SSE_CONFIG_DIR: /app/configs
    volumes:
      # Runtime configuration (django-config.json, secret-key.txt, ...).
      - ./configs:/app/configs:ro
      - upload_sse:/app/upload_sse
      - staticfiles:/app/staticfiles
    ports:
      # Loopback only — nginx is the single public entry point.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # exec: torch/transformers/joblib unpack temporary code into /tmp.
      - /tmp:rw,exec

  # One-shot jobs (the profile keeps them out of `up`):
  #   docker compose --profile tools run --rm tools <command>
  tools:
    profiles: ["tools"]
    image: sse-api:${SSE_IMAGE_TAG:-0.0.2}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_RADLAB_DATA: ${INSTALL_RADLAB_DATA:-0}
        INSTALL_LLM_ROUTER: ${INSTALL_LLM_ROUTER:-0}
    env_file: .env
    environment:
      ENV_DB_HOST: postgres
      ENV_DB_PORT: "5432"
      ENV_MILVUS_HOST: milvus
      ENV_MILVUS_PORT: "19530"
      ENV_DEBUG: "0"
      DJANGO_SETTINGS_MODULE: sse_api.config.settings
      SSE_CONFIG_DIR: /app/configs
    volumes:
      - ./configs:/app/configs
      - upload_sse:/app/upload_sse
      - staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: ["python", "-m", "sse_api.manage", "migrate", "--noinput"]

  # --- indexing queue (profile "indexing") -----------------------------------
  # Both services are only started with:  docker compose --profile indexing up -d
  # They are needed when ENV_USE_CELERY=1; without the profile the engine keeps
  # indexing in the request which uploaded the files.
  rabbitmq:
    profiles: ["indexing"]
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      # Defaults are fine on the loopback interface; change them before
      # publishing the port with RABBITMQ_BIND_HOST.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME_IN_ENV}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      # Loopback only; the broker is used by the worker on this network.
      - "${RABBITMQ_BIND_HOST:-127.0.0.1}:${RABBITMQ_HOST_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Celery worker of the indexing: one document per task, so the concurrency is
  # about memory (the embedder of a collection is loaded once per process).
  worker:
    profiles: ["indexing"]
    image: sse-api:${SSE_IMAGE_TAG:-0.0.2}
    restart: unless-stopped
    env_file: .env
    environment:
      ENV_DB_HOST: postgres
      ENV_DB_PORT: "5432"
      ENV_MILVUS_HOST: milvus
      ENV_MILVUS_PORT: "19530"
      ENV_DEBUG: "0"
      ENV_USE_CELERY: "1"
      ENV_CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-sse}:${RABBITMQ_PASSWORD:-CHANGE_ME_IN_ENV}@rabbitmq:5672/
      DJANGO_SETTINGS_MODULE: sse_api.config.settings
      SSE_CONFIG_DIR: /app/configs
    volumes:
      - ./configs:/app/configs:ro
      - upload_sse:/app/upload_sse
      - staticfiles:/app/staticfiles
    command:
      [
        "celery",
        "-A",
        "sse_api.config",
        "worker",
        "-Q",
        "indexing",
        "-l",
        "INFO",
        "--pool=${CELERY_WORKER_POOL:-solo}",
        "--concurrency=${CELERY_CONCURRENCY:-1}",
      ]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # exec: torch/transformers/joblib unpack temporary code into /tmp.
      - /tmp:rw,exec
    stop_grace_period: 5m

  # --- PostgreSQL ------------------------------------------------------------
  postgres:
    # latest = the newest major release; nothing is in production yet, so we
    # track it.  Postgres >= 18 keeps its clusters under
    # /var/lib/postgresql/<version>/docker and declares VOLUME /var/lib/postgresql,
    # so the data volume is mounted there (mounting deeper, at .../data, makes
    # the image refuse to start).  When the major version bumps, either run
    # pg_upgrade or wipe and re-initialise (./run.sh clean / docker compose
    # down -v + re-index), because PostgreSQL is the source of truth.
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # Bound to loopback by default; only expose it on a trusted network.
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5471}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Milvus ----------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v3.0.3
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # The sidecar etcd has no authentication; the Milvus >= 3.0 image
      # defaults to etcd.auth.enabled=true and would refuse to start.
      ETCD_AUTH_ENABLED: "false"
      MINIO_ADDRESS: minio:9000
      COMMON_SECURITY_AUTHORIZATIONENABLED: ${MILVUS_AUTH_ENABLED:-false}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # Bound to loopback by default; the SDK and the metrics port are only
      # needed on the host for administration. `MILVUS_BIND_HOST` matches
      # `POSTGRES_BIND_HOST` and the `run.sh`/`run-en.sh` defaults.
      - "${MILVUS_BIND_HOST:-127.0.0.1}:${MILVUS_HOST_PORT:-19530}:19530"
      - "${MILVUS_BIND_HOST:-127.0.0.1}:${MILVUS_METRICS_HOST_PORT:-19121}:19121"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    # No published ports: MinIO is reachable on the compose network only.

  minio-init:
    image: minio/mc:RELEASE.2023-03-22T18-34-53Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ACCESS_KEY}\" \"$${MINIO_SECRET_KEY}\"; do sleep 2; done;
      mc mb -p local/milvus-bucket || true;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}

  # --- reverse proxy ---------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/sse.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/tls:ro
      - staticfiles:/srv/static:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  milvus_data:
  etcd_data:
  minio_data:
  upload_sse:
  staticfiles:
