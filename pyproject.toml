[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-engine"
version = "0.1.0"
description = "Semantic Search Engine - Django REST API server"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sse_api*", "sse_tools*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sse_api.tests.settings_django"
testpaths = ["src/sse_api"]

[tool.black]
line-length = 85
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.bandit]
skips = ["B101", "B110", "B112"]
