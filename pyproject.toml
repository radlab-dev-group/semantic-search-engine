[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-engine"
version = "0.1.0"
description = "Semantic Search Engine - Django REST API server"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sse_api*", "sse_tools*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sse_api.tests.settings_django"
testpaths = ["src/sse_api", "sse_lib"]

# --- formatting -------------------------------------------------------------
[tool.black]
line-length = 85
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

# --- static analysis --------------------------------------------------------
[tool.bandit]
skips = ["B101", "B110", "B112"]

[tool.pylint.'messages control']
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "use-symbolic-message-instead",
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
strict = true
